# Despliegue del backend en el VPS (backend/deploy/README.md).
#
# 1. gate: pip-audit de las dependencias de produccion y gitleaks.
# 2. build: construye backend/Dockerfile y lo publica en GHCR con el sha del
#    commit (y `latest`), con SBOM y procedencia.
# 3. deploy: copia compose.yml y backup.sh a ~/apps/finanzia por SSH, fija la imagen
#    por digest, corre las migraciones y levanta el stack esperando a que
#    todo quede sano.
#
# Lint y tests corren en local antes de subir (`just lint`, `just test`).
# Secretos del entorno `production`: VPS_HOST, VPS_USER y VPS_SSH_KEY.
# Los secretos de la app viven solo en el `.env` del VPS.
name: Deploy backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

# Un despliegue a la vez y sin cancelar uno a medias.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/cristianmmst/finanzia-backend

jobs:
  # Gate de release (constitucion P1, spec 009 §8): una vulnerabilidad
  # conocida en las dependencias de produccion o un secreto en el repo
  # frenan el despliegue.
  gate:
    name: pip-audit + gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: pip-audit (dependencias de la imagen)
        working-directory: backend
        # --no-emit-project: el paquete finanzia no esta en PyPI.
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/requirements.txt
          uvx pip-audit --strict --desc --disable-pip --require-hashes -r /tmp/requirements.txt

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Imagen en GHCR
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    name: VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      # Junto a las otras apps del servidor (~/apps/<app>).
      DEPLOY_DIR: apps/finanzia
    steps:
      - uses: actions/checkout@v4

      - name: Llave SSH y huella del host
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # La huella se lee del servidor en cada despliegue (sin secreto que
          # mantener). No protege de un servidor suplantado en la red; para
          # eso habria que fijarla como secreto.
          ssh-keyscan -t ed25519 "$VPS_HOST" > ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "ssh-keyscan no obtuvo la huella de $VPS_HOST"; exit 1; }
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_HOST }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copiar compose.yml, deploy.sh y backup.sh
        run: |
          ssh vps "test -f ~/$DEPLOY_DIR/.env"             || { echo "Falta ~/$DEPLOY_DIR/.env en el VPS (backend/deploy/README.md)."; exit 1; }
          scp backend/deploy/compose.yml backend/deploy/deploy.sh backend/deploy/backup.sh "vps:~/$DEPLOY_DIR/"
          ssh vps "chmod 750 ~/$DEPLOY_DIR/deploy.sh ~/$DEPLOY_DIR/backup.sh"

      - name: Migrar y levantar
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # El token entra por stdin (nunca en la linea de comandos) y solo
          # vale lo que dura el job: se borra del VPS al terminar, pase lo que
          # pase. deploy.sh corre sin stdin (ver su cabecera).
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          status=0
          ssh -n vps "~/$DEPLOY_DIR/deploy.sh '$IMAGE_REF'" || status=$?
          ssh -n vps "docker logout ghcr.io > /dev/null" || true
          exit "$status"

name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint (ruff, pyright, import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - run: uv python install 3.12

      - name: Instalar dependencias (lockfile congelado)
        run: uv sync --frozen --all-groups

      - name: Verificar que el lockfile este al dia
        run: uv lock --check

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format --check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Import-linter (fronteras hexagonales)
        run: uv run lint-imports

  test:
    name: Tests + cobertura de dominio
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finanzia
          POSTGRES_PASSWORD: finanzia
          POSTGRES_DB: finanzia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finanzia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      FINANZIA_TEST_DATABASE_URL: postgresql+asyncpg://finanzia:finanzia@localhost:5432/finanzia_test
      FINANZIA_TEST_REDIS_URL: redis://localhost:6379/1
      FINANZIA_TEST_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://finanzia:finanzia@localhost:5432/finanzia_test_migrations
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - run: uv python install 3.12

      - name: Instalar dependencias (lockfile congelado)
        run: uv sync --frozen --all-groups

      - name: Crear bases de datos de test (finanzia_test, finanzia_test_migrations)
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U finanzia -d finanzia -c "CREATE DATABASE finanzia_test;"
          docker exec "${{ job.services.postgres.id }}" psql -U finanzia -d finanzia -c "CREATE DATABASE finanzia_test_migrations;"

      - name: Ejecutar suite completa con cobertura
        run: uv run pytest --cov=finanzia --cov-report=xml --cov-report=term

      - name: Cobertura de dominio ≥90%
        run: uv run pytest tests/unit -m unit --cov=finanzia.modules.ledger.domain --cov=finanzia.modules.identity.domain --cov=finanzia.modules.parsing.domain --cov=finanzia.modules.ingestion.domain --cov-fail-under=90

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml

  audit:
    name: Auditoria de dependencias (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - run: uv python install 3.12

      - name: Instalar dependencias (lockfile congelado)
        run: uv sync --frozen --all-groups

      - name: Exportar requirements desde el lockfile
        # --no-emit-project: excluye el paquete local "finanzia" (no publicado en
        # PyPI); sin este flag, pip-audit --strict falla con
        # "Dependency not found on PyPI" para el propio proyecto, no una
        # vulnerabilidad real. Confirmado localmente (ver task-2-report.md).
        run: uv export --frozen --no-hashes --all-groups --no-emit-project -o requirements-audit.txt

      - name: pip-audit
        run: uv run pip-audit -r requirements-audit.txt --strict --desc

  gitleaks:
    name: Gitleaks (secretos)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

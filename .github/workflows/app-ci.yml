name: App CI

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-ci.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app-ci.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: Analyze + tests + cobertura (AC-APP-4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.7
          cache: true

      - name: Dependencias (lockfile congelado)
        run: flutter pub get --enforce-lockfile

      - name: Codigo generado al dia (build_runner + gen-l10n)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code -- .

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze (sin warnings ni infos)
        run: flutter analyze --fatal-infos --fatal-warnings

      # Los goldens dependen del rasterizador de cada plataforma y el contrato
      # necesita el backend local: ambos se corren a mano (app/README.md).
      - name: Tests
        run: flutter test --coverage --exclude-tags golden,backend

      - name: Gate de cobertura domain + application (>= 90 %)
        run: dart run tool/coverage_gate.dart coverage/lcov.info 90

# Build de iOS sin firmar para instalar con SideStore (F4.3b, app/README.md).
# Codemagic compila en macOS lo que este equipo (Windows) no puede. El .ipa
# sale sin firma; SideStore lo firma con el Apple ID del usuario al
# instalarlo y hay que refrescarlo cada 7 días.
#
# Se corre a mano desde codemagic.io (sin disparadores). Variables, en el
# grupo `luka` de la app en Codemagic:
#   API_BASE_URL  obligatoria: URL pública del backend, en producción
#                 https://luka.a360soft.tech. El default de desarrollo, localhost, no
#                 llega desde el iPhone.
#   GOOGLE_SERVER_CLIENT_ID  opcional: sin ella se usa el default de la app
#                 (luka-510204). En iOS el que manda es el de
#                 app/ios/Flutter/GoogleSignIn.xcconfig, así que si se define
#                 tiene que coincidir con ese.
workflows:
  ios-unsigned:
    name: iOS sin firmar (SideStore)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      groups:
        - luka
      flutter: 3.35.7
      xcode: latest
      cocoapods: default
    scripts:
      - name: Revisar configuración
        script: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Falta API_BASE_URL en el grupo 'luka' de Codemagic."
            exit 1
          fi
          if ! grep -Eq '^GOOGLE_IOS_CLIENT_ID = .+' app/ios/Flutter/GoogleSignIn.xcconfig; then
            echo "Falta el cliente OAuth de iOS en app/ios/Flutter/GoogleSignIn.xcconfig."
            exit 1
          fi
          if [ -n "$GOOGLE_SERVER_CLIENT_ID" ] && ! grep -Fxq "GOOGLE_SERVER_CLIENT_ID = $GOOGLE_SERVER_CLIENT_ID" app/ios/Flutter/GoogleSignIn.xcconfig; then
            echo "GOOGLE_SERVER_CLIENT_ID no coincide con app/ios/Flutter/GoogleSignIn.xcconfig."
            exit 1
          fi
      - name: Dependencias
        script: |
          cd app
          flutter pub get
      - name: Compilar sin firmar
        script: |
          cd app
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="$API_BASE_URL"             ${GOOGLE_SERVER_CLIENT_ID:+--dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"}
      - name: Empaquetar .ipa
        script: |
          cd app/build/ios/iphoneos
          rm -rf Payload luka.ipa
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qry luka.ipa Payload
    artifacts:
      - app/build/ios/iphoneos/luka.ipa

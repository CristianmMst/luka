# =============================================================================
# luka - server block para el nginx de la VPS (backend/deploy/README.md)
# Copiar a: ~/apps/nginx/conf.d/luka.conf  (y recargar nginx)
# Patron calcado de biologistica.conf.
#
#   luka.a360soft.tech -> API (red `proxy`, alias luka-api:8000)
#
# Requisitos previos:
#   1) Registro DNS A de luka.a360soft.tech apuntando a la VPS.
#   2) Certificado emitido con certbot en
#      /etc/nginx/ssl/live/luka-a360soft-tech/ (README, paso 3).
#
# Sin access log a proposito: la ruta cruda y el query pueden llevar datos
# del usuario (spec 009, P1); la API ya loguea la plantilla de la ruta.
# =============================================================================

# --- HTTP -> HTTPS + challenge ACME ---
server {
    listen 80;
    server_name luka.a360soft.tech;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- API ---
server {
    listen 443 ssl;
    server_name luka.a360soft.tech;

    ssl_certificate     /etc/nginx/ssl/live/luka-a360soft-tech/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/luka-a360soft-tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log off;
    error_log  /var/log/nginx/luka-api-error.log;

    # HSTS, nosniff y Referrer-Policy los pone la API (SecurityHeadersMiddleware):
    # repetirlos aqui duplica las cabeceras.

    # La API corta en 1 MiB (LUKA_MAX_BODY_BYTES).
    client_max_body_size 2m;

    location / {
        # Se resuelve en cada peticion: nginx arranca aunque luka este
        # caido y sigue al contenedor si cambia de IP al redesplegar.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $luka_api http://luka-api:8000;
        proxy_pass $luka_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finanzia
      POSTGRES_PASSWORD: finanzia
      POSTGRES_DB: finanzia
    ports:
      - "5432:5432"
    volumes:
      - finanzia_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanzia -d finanzia"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      FINANZIA_DATABASE_URL: postgresql+asyncpg://finanzia:finanzia@postgres:5432/finanzia
      FINANZIA_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build: .
    command: ["arq", "finanzia.worker.WorkerSettings"]
    env_file: .env
    environment:
      FINANZIA_DATABASE_URL: postgresql+asyncpg://finanzia:finanzia@postgres:5432/finanzia
      FINANZIA_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  finanzia_postgres_data:

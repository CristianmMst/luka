services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: luka
      POSTGRES_PASSWORD: luka
      POSTGRES_DB: luka
    ports:
      - "5432:5432"
    volumes:
      - luka_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luka -d luka"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

# Solo infraestructura: la API (`just dev`) y el worker (`just worker`) corren
# locales, con el código y el `.env` actuales.

volumes:
  luka_postgres_data:

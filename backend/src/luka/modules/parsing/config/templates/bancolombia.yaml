# Plantillas de extraccion Bancolombia (spec 006 §4.1, F2.3).
# Regla de oro: ninguna plantilla entra sin fixture real anonimizado + test
# (backend/tests/fixtures/emails/bancolombia/*.txt).
bank: bancolombia
version: 1
relevant_line_prefix: "Bancolombia:" # extracto para plantillas y LLM (RNF-5)
templates:
  - id: compra_tdeb # fixtures: compra_tdeb.txt, compra_tdeb_2.txt
    direction: debit
    pattern: 'Bancolombia: Compraste \$(?P<amount>[\d.,]+) en (?P<merchant>.+?) con tu T\.Deb \*(?P<last4>\d{4}), el (?P<date>\d{2}/\d{2}/\d{4}) a las (?P<time>\d{2}:\d{2})'
    date_format: "%d/%m/%Y"
  - id: transferencia_llave # fixture: transferencia_llave.txt, transferencia_llave_wrap.txt
    direction: debit
    counterparty: true # merchant = destinatario (persona)
    pattern: 'Bancolombia: (?:(?P<holder>[^,]{1,80}), )?transferiste \$(?P<amount>[\d.,]+) a la llave (?P<key>\S+) desde tu cuenta \*(?P<last4>\d{4}) a (?P<merchant>.+?) el (?P<date>\d{2}/\d{2}/\d{2}) a las (?P<time>\d{2}:\d{2})'
    date_format: "%d/%m/%y"
  - id: transferencia_llave_recibida # fixture: transferencia_llave_recibida_wrap.txt
    direction: credit
    counterparty: true # merchant = quien envia (persona)
    pattern: 'Bancolombia: (?:(?P<holder>[^,]{1,80}), )?recibiste una transferencia de (?P<merchant>.+?) por \$(?P<amount>[\d.,]+) en tu cuenta \*(?P<last4>\d{4}) conectada a la llave (?P<key>\S+) el (?P<date>\d{2}/\d{2}/\d{2}) a las (?P<time>\d{2}:\d{2})'
    date_format: "%d/%m/%y"
  - id: nomina # fixture: nomina.txt
    direction: credit
    pattern: 'Bancolombia: Recibiste un pago de Nomina de (?P<merchant>.+?) por \$(?P<amount>[\d.,]+) en tu cuenta de (?P<account_kind>Ahorros|Corriente) el (?P<date>\d{2}/\d{2}/\d{4}) a las (?P<time>\d{2}:\d{2})'
    date_format: "%d/%m/%Y"
    suggested_category: nomina
  - id: pago_qr # fixtures: pago_qr.txt, pago_qr_wrap.txt
    direction: debit
    default_merchant: Pago QR # el correo solo trae una llave numerica, no el comercio
    pattern: 'Bancolombia: (?:(?P<holder>[^$]{1,80}?),? )?pagaste \$(?P<amount>[\d.,]+) por codigo QR desde tu cuenta \*(?P<last4>\d{4}) a la llave (?P<key>\S+) el (?P<date>\d{2}/\d{2}/\d{4}) a las (?P<time>\d{2}:\d{2})'
    date_format: "%d/%m/%Y"
  - id: pago_producto # fixtures: pago_producto.txt, pago_producto_2.txt
    direction: debit
    # "Pagaste $X a <COMERCIO> desde tu producto NNNN el dd/mm/aaaa hh:mm:ss":
    # el producto va sin asterisco y la hora trae segundos (se ignoran).
    pattern: 'Bancolombia: Pagaste \$(?P<amount>[\d.,]+) a (?P<merchant>.+?) desde tu producto \*?(?P<last4>\d{4}) el (?P<date>\d{2}/\d{2}/\d{4}) (?:a las )?(?P<time>\d{2}:\d{2})'
    date_format: "%d/%m/%Y"
  - id: transferencia_cuenta # fixture: transferencia_cuenta_wrap.txt
    direction: debit
    counterparty: true # envio a otra persona, aunque el correo no la nombra
    default_merchant: Transferencia # el correo solo trae el numero de la cuenta destino
    pattern: 'Bancolombia: (?:(?P<holder>[^$]{1,80}?),? )?[Tt]ransferiste \$(?P<amount>[\d.,]+) desde tu cuenta \*(?P<last4>\d{4}) a la cuenta \*\d+ el (?P<date>\d{2}/\d{2}/\d{2}) a las (?P<time>\d{2}:\d{2})'
    date_format: "%d/%m/%y"

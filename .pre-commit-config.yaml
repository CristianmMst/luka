repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock --check (backend)
        # verifica que backend/uv.lock esta al dia con backend/pyproject.toml
        entry: bash -c "cd backend && uv lock --check"
        language: system
        pass_filenames: false
        files: ^backend/(pyproject\.toml|uv\.lock)$

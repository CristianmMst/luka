name: finanzia
description: "finanzia: gastos capturados automáticamente y reporte fiscal (formulario 210)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  dio: ^5.11.1
  drift: ">=2.28.0 <2.29.0"
  drift_flutter: ">=0.2.4 <0.2.8"
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ">=3.0.0 <4.0.0"
  flutter_secure_storage: ^10.3.4
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.0.0
  go_router: ^17.2.3
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  json_annotation: ^4.9.0

dev_dependencies:
  build_runner: ">=2.5.0 <2.8.0"
  drift_dev: ">=2.28.0 <2.29.0"
  flutter_test:
    sdk: flutter
  freezed: ">=3.0.0 <3.2.0"
  http_mock_adapter: ^0.6.1
  json_serializable: ">=6.9.0 <6.11.0"
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/
    - assets/fonts/licenses/

  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-500.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-600.ttf
          weight: 600
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-500.ttf
          weight: 500

name: luka
description: "luka: gastos capturados automáticamente y reporte fiscal (formulario 210)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  dio: ^5.11.1
  drift: ">=2.28.0 <2.29.0"
  drift_flutter: ">=0.2.4 <0.2.8"
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^20.1.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ">=3.0.0 <4.0.0"
  flutter_secure_storage: ^10.3.4
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.0.0
  go_router: ^17.2.3
  google_sign_in: ^7.2.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  ndef_record: ^1.3.3
  nfc_manager: ^4.1.1
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  timezone: ^0.10.1
  uuid: ^4.6.0
  vector_graphics: ^1.2.0

dev_dependencies:
  build_runner: ">=2.5.0 <2.8.0"
  drift_dev: ">=2.28.0 <2.29.0"
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  freezed: ">=3.0.0 <3.2.0"
  http_mock_adapter: ^0.6.1
  json_serializable: ">=6.9.0 <6.11.0"
  mocktail: ^1.0.5
  vector_graphics_compiler: ^1.2.0
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Los SVG se compilan a vector_graphics al empaquetar: no se parsean en
    # cada arranque. Se dibujan con SvgPicture(AssetBytesLoader(...)).
    - path: assets/brand/
      transformers:
        - package: vector_graphics_compiler
    - assets/fonts/licenses/

  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-500.ttf
          weight: 500
        - asset: assets/fonts/BricolageGrotesque-700.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-600.ttf
          weight: 600
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-500.ttf
          weight: 500

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/core/l10n/gen/**
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    # App, no paquete publicado: la documentacion de API publica no aporta.
    public_member_api_docs: false
